name: Build & deploy site

# Runs the generator (build.ps1), which pulls new videos from YouTube, regenerates
# the pages + home grid + sitemap, then deploys the site to GitHub Pages.

on:
  schedule:
    # 3x/day, at :17 past the hour to avoid GitHub's busy top-of-hour (UTC).
    - cron: '17 5,13,21 * * *'
  workflow_dispatch: {}   # the manual "Run workflow" / publish-now button

# Let the build commit the updated catalog back, and publish to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate site from YouTube
        shell: powershell
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: .\build.ps1

      - name: Commit updated catalog & pages
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "Auto-update videos [skip ci]"
            git push
            Write-Host "Committed updates."
          } else {
            Write-Host "No changes to commit."
          }

      - name: Assemble clean site folder
        shell: powershell
        run: |
          if (Test-Path _site) { Remove-Item _site -Recurse -Force }
          New-Item -ItemType Directory -Force _site | Out-Null
          Copy-Item index.html, styles.css, site.js, logo.svg, logo-light.svg, sitemap.xml _site\
          Copy-Item -Recurse -Force videos _site\videos
          # Custom domain + skip Jekyll processing
          Set-Content -Path _site\CNAME -Value 'jensenoffroad.com' -NoNewline
          New-Item -ItemType File -Force _site\.nojekyll | Out-Null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
