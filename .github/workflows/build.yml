name: Build & deploy site

on:
  schedule:
    # 3x/day in Mountain Time (auto-adjusts for daylight saving). :17 dodges GitHub's busy top-of-hour.
    - cron: '17 8,14,18 * * *'
      timezone: 'America/Denver'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate site from YouTube
        shell: powershell
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: .\build.ps1

      - name: Commit updated catalog & pages
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "Auto-update videos [skip ci]"
            git push
            Write-Host "Committed updates."
          } else {
            Write-Host "No changes to commit."
          }

      - name: Assemble clean site folder
        shell: powershell
        run: |
          if (Test-Path _site) { Remove-Item _site -Recurse -Force }
          New-Item -ItemType Directory -Force _site | Out-Null
          Copy-Item index.html, all-videos.html, styles.css, site.js, logo.svg, logo-light.svg, sitemap.xml, robots.txt _site\
          Copy-Item -Recurse -Force videos _site\videos
          Set-Content -Path _site\CNAME -Value 'jensenoffroad.com' -NoNewline
          New-Item -ItemType File -Force _site\.nojekyll | Out-Null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
